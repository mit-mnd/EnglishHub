# Mọi thông tin nhạy cảm đọc từ biến môi trường (hoặc file backend/.env - KHÔNG commit file này).
spring:
  application:
    name: englishhub-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:EnglishLearningDB};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: EnglishHubPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Schema do Flyway quản lý, Hibernate chỉ kiểm tra khớp
      naming:
        physical-strategy: com.englishhub.common.config.PascalCaseNamingStrategy
    properties:
      hibernate:
        default_batch_fetch_size: 50           # tránh N+1 khi nạp collection lazy
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant <-> DATETIME2 (UTC)

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  web:
    resources:
      cache:
        period: 7d                        # file tĩnh /media/** (audio bài nghe)

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}       # audio/video bài học do admin tải lên
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:52MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

englishhub:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}                 # base64, >= 32 byte (256 bit)
    issuer: englishhub
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  security:
    password-reset-ttl: 30m
  placement:
    grace-period: 30s                     # cho phép nộp trễ do độ trễ mạng
  dictionary:
    provider: ${DICTIONARY_PROVIDER:free-dictionary}    # free-dictionary | none
    base-url: https://api.dictionaryapi.dev/api/v2/entries/en
    timeout: 4s
  storage:
    dir: ${APP_STORAGE_DIR:./uploads}                 # bản ghi âm của học viên (không public)
  ai:
    speech:
      provider: ${AI_SPEECH_PROVIDER:mock}            # mock | azure
      azure-key: ${AZURE_SPEECH_KEY:}
      azure-region: ${AZURE_SPEECH_REGION:southeastasia}
      timeout: 15s
    writing:
      provider: ${AI_WRITING_PROVIDER:rule-based}
  srs:
    new-cards-per-day: ${SRS_NEW_CARDS_PER_DAY:20}

logging:
  level:
    org.hibernate.orm.incubating: ERROR   # ẩn cảnh báo về preferred_instant_jdbc_type (đã chủ đích dùng)

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}       # đặt false ở production
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: true
